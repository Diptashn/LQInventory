[project]
name = "cake-inventory"
version = "0.1.0"
description = "Cake atelier inventory + COGS sync"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
  "gspread>=6.0",
  "google-api-python-client>=2.0",
  "google-auth>=2.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
