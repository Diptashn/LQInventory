{% extends "base.html" %}
{% block title %}Edit — LilQuin Kitchen{% endblock %}
{% block content %}
<div class="card">
  <h2>Edit {{ item.name }}</h2>
  <p class="sub">Qty dan harga akan sync ke Sheets</p>
  <form method="post" action="/ui/inventory/{{ item.id }}/edit">
    <div class="grid2">
      <div>
        <label>Nama bahan</label>
        <input value="{{ item.name }}" disabled>
        <div style="font-size:12px; color:#8a7a6d;">Nama tidak diubah (FK ke Sheets)</div>
      </div>
      <div>
        <label for="qty">Qty (grams)</label>
        <input id="qty" name="qty" type="number" step="0.01" value="{{ item.qty }}" required>
      </div>
      <div>
        <label for="unit_cost">Harga /kg (Rp)</label>
        <input id="unit_cost" name="unit_cost" type="number" step="0.01" value="{{ item.unit_cost }}" required>
      </div>
      <!-- Produk dropdown removed: inventory inputs only to Inventory sheet -->
      <div style="display:flex; gap:8px; align-items:end;">
        <button class="btn btn-primary" type="submit">Simpan</button>
        <a href="/ui/inventory" class="btn btn-ghost" style="display:inline-block; text-decoration:none; text-align:center; padding:12px 16px;">Batal</a>
      </div>
    </div>
  </form>
</div>
{% endblock %}
