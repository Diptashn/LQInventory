<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory — LilQuin Kitchen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-stone-100 text-stone-800 min-h-screen">

  <header class="bg-white border-b border-stone-200 sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 font-semibold text-stone-900">
        <img src="/images/logo.jpg" alt="LilQuin Kitchen" class="h-8 w-8 rounded">
        <span>LilQuin Kitchen</span>
      </a>
      <nav class="flex gap-1 text-sm">
        <a href="inventory.html" class="px-3 py-1.5 rounded bg-stone-100 font-medium">📋 Inventory</a>
        <a href="estimate.html" class="px-3 py-1.5 rounded hover:bg-stone-100">💰 Estimate</a>
        <a href="sheets.html" class="px-3 py-1.5 rounded hover:bg-stone-100">📊 Sheets Sync</a>
        <button id="logoutBtn" class="px-3 py-1.5 rounded hover:bg-red-50 text-red-600 text-sm font-medium">Logout</button>
      </nav>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8">

    <!-- Add Item Form -->
    <section class="bg-white rounded-2xl shadow-sm border border-stone-200 p-6 mb-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-semibold text-stone-900">Tambah Bahan</h2>
        <span class="text-xs text-stone-500">Data tersimpan di localStorage (demo)</span>
      </div>
      <form id="add-form" class="grid grid-cols-1 sm:grid-cols-3 lg:grid-cols-4 gap-4">
        <div>
          <label class="block text-sm font-medium text-stone-700 mb-1">Nama bahan</label>
          <input id="name" name="name" placeholder="Tepung Terigu" required class="w-full px-3 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-[#b4602e] focus:border-transparent">
        </div>
        <div>
          <label class="block text-sm font-medium text-stone-700 mb-1">Qty (grams)</label>
          <input id="qty" name="qty" type="number" step="0.01" placeholder="1000" required class="w-full px-3 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-[#b4602e] focus:border-transparent">
        </div>
        <div>
          <label class="block text-sm font-medium text-stone-700 mb-1">Harga /kg (Rp)</label>
          <input id="unit_cost" name="unit_cost" type="number" step="0.01" placeholder="15000" required class="w-full px-3 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-[#b4602e] focus:border-transparent">
        </div>
        <div class="flex items-end">
          <button type="submit" class="w-full px-4 py-2.5 bg-[#b4602e] text-white font-medium rounded-lg hover:bg-[#8a4520] transition">Tambah</button>
        </div>
      </form>
    </section>

    <!-- Items List -->
    <section class="bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden">
      <div class="p-4 border-b border-stone-200 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <h2 class="text-xl font-semibold text-stone-900">Daftar Bahan</h2>
        <input id="search" placeholder="Cari: tepung, gula…" class="px-3 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-[#b4602e] focus:border-transparent w-full sm:w-64" aria-label="Search items">
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-stone-50 text-left text-stone-600 uppercase tracking-wider">
            <tr>
              <th class="p-3">Nama</th>
              <th class="p-3 text-right">Qty (g)</th>
              <th class="p-3 text-right">Harga/KG</th>
              <th class="p-3 text-right">Harga/Gr</th>
              <th class="p-3">Updated</th>
              <th class="p-3 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="items-body" class="divide-y divide-stone-100">
            <!-- rows injected by JS -->
          </tbody>
        </table>
      </div>

      <div id="empty-state" class="hidden p-8 text-center text-stone-500">
        Belum ada bahan. Tambah di atas.
      </div>
    </section>

  </main>

  <footer class="text-center text-xs text-stone-400 py-6">
    LilQuin Kitchen — inventory & estimation
  </footer>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
