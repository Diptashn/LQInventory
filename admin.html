<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — LilQuin Kitchen</title>
  <link rel="icon" href="/favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-stone-100 text-stone-800 min-h-screen">
  <!-- Top bar -->
  <header class="bg-white border-b border-stone-200 sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between flex-wrap gap-y-2">
      <a href="index.html" class="flex items-center gap-2 font-semibold text-stone-900">
        <img src="/images/logo.jpg" alt="LilQuin Kitchen" class="h-8 w-8 rounded">
        <span>LilQuin Kitchen</span>
      </a>
      <nav class="flex flex-wrap gap-1 text-sm items-center">
        <a href="index.html" class="px-3 py-1.5 rounded hover:bg-stone-100">🏠 Dashboard</a>
        <a href="inventory.html" class="px-3 py-1.5 rounded hover:bg-stone-100">📋 Inventory</a>
        <a href="estimate.html" class="px-3 py-1.5 rounded hover:bg-stone-100">💰 Estimate</a>
        <a href="sheets.html" class="px-3 py-1.5 rounded hover:bg-stone-100">📊 Sheets Sync</a>
        <a href="admin.html" class="px-3 py-1.5 rounded bg-stone-100 font-medium">🛡️ Admin</a>
        <span id="nav-user" class="text-xs px-2 py-1 bg-amber-100 text-amber-800 rounded font-medium"></span>
        <button id="logoutBtn" class="px-3 py-1.5 rounded hover:bg-red-50 text-red-600 text-sm font-medium">Logout</button>
      </nav>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-bold text-stone-900 flex items-center gap-2">
          <span>🛡️</span> Admin Panel
        </h1>
        <p class="text-sm text-stone-500 mt-0.5">Kelola akun pengguna (Super Admin only)</p>
      </div>
    </div>

    <!-- Add User Form -->
    <section class="bg-white rounded-2xl shadow-sm border border-stone-200 p-6 mb-6">
      <h2 class="text-lg font-semibold text-stone-900 mb-3">Tambah Pengguna Baru</h2>
      <form id="add-user-form" class="grid grid-cols-1 sm:grid-cols-3 gap-4 items-end">
        <div>
          <label for="new-username" class="block text-sm font-medium text-stone-700 mb-1">Username</label>
          <input type="text" id="new-username" required
                 class="w-full px-3 py-2 border border-stone-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#b4602e] text-sm"
                 placeholder="username baru">
        </div>
        <div>
          <label for="new-password" class="block text-sm font-medium text-stone-700 mb-1">Password</label>
          <input type="password" id="new-password" required
                 class="w-full px-3 py-2 border border-stone-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#b4602e] text-sm"
                 placeholder="••••••••">
        </div>
        <div>
          <button type="submit"
                  class="w-full px-4 py-2 bg-[#b4602e] text-white font-medium rounded-lg hover:bg-[#8a4520] transition shadow-sm text-sm disabled:opacity-50">
            + Tambah User
          </button>
        </div>
      </form>
      <p id="add-user-msg" class="text-sm mt-3 hidden"></p>
    </section>

    <!-- Users List -->
    <section class="bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden">
      <div class="p-4 border-b border-stone-200 flex items-center justify-between">
        <h2 class="text-lg font-semibold text-stone-900">Daftar Pengguna</h2>
      </div>
      <div id="users-list" class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-stone-50 text-left text-stone-600 uppercase tracking-wider text-xs">
            <tr>
              <th class="p-3 font-semibold">Username</th>
              <th class="p-3 font-semibold">Dibuat Pada</th>
              <th class="p-3 text-center font-semibold">Aksi</th>
            </tr>
          </thead>
          <tbody id="users-body" class="divide-y divide-stone-100">
            <tr><td colspan="3" class="p-6 text-center text-stone-400">Memuat data pengguna…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="text-center text-xs text-stone-400 py-6">
    LilQuin Kitchen — inventory &amp; estimation
  </footer>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
