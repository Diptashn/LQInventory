<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — LilQuin Kitchen</title>
  <link rel="icon" href="/favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-stone-100 text-stone-800 min-h-screen flex items-center justify-center p-4">
  <main class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-sm border border-stone-200 p-8">
      <div class="flex flex-col items-center mb-6">
        <img src="/images/logo.jpg" alt="LilQuin Kitchen" class="h-14 w-14 rounded-xl shadow-sm mb-3">
        <h1 class="text-2xl font-bold text-stone-900">LilQuin Kitchen</h1>
        <p class="text-xs text-stone-500 mt-1">Inventory & Estimation System</p>
      </div>

      <form id="loginForm" class="space-y-4" novalidate>
        <div>
          <label for="username" class="block text-sm font-medium text-stone-700 mb-1">Username</label>
          <input type="text" id="username" name="username" required autocomplete="username"
                 class="w-full px-3.5 py-2.5 border border-stone-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#b4602e] focus:border-transparent text-sm transition"
                 placeholder="Masukkan username" />
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-stone-700 mb-1">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password"
                 class="w-full px-3.5 py-2.5 border border-stone-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#b4602e] focus:border-transparent text-sm transition"
                 placeholder="••••••••" />
        </div>
        <div id="err" class="text-red-600 text-sm hidden bg-red-50 p-2.5 rounded-lg border border-red-200"></div>
        <button type="submit" id="submitBtn"
                class="w-full py-2.5 bg-[#b4602e] text-white font-medium rounded-lg hover:bg-[#8a4520] focus:outline-none focus:ring-2 focus:ring-[#b4602e] focus:ring-offset-2 transition shadow-sm">
          Sign In
        </button>
      </form>
    </div>
    <p class="text-center text-xs text-stone-400 mt-4">
      LilQuin Kitchen &copy; 2026. Admin creates accounts via /api/register
    </p>
  </main>

  <script type="module">
    const API_BASE = window.APP_API_BASE || (location.hostname === 'localhost' ? 'http://localhost:8080/api' : 'https://lq-inventory.vercel.app/api');
    const form = document.getElementById('loginForm');
    const errEl = document.getElementById('err');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.classList.add('hidden');
      errEl.textContent = '';
      
      const fd = new FormData(form);
      const username = fd.get('username')?.trim();
      const password = fd.get('password');

      if (!username || !password) {
        errEl.textContent = 'Mohon masukkan username dan password.';
        errEl.classList.remove('hidden');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';

      try {
        const res = await fetch(`${API_BASE}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login gagal');
        
        localStorage.setItem('auth_token', data.token);
        
        const urlParams = new URLSearchParams(window.location.search);
        const next = urlParams.get('next');
        const destination = next ? decodeURIComponent(next) : 'index.html';
        window.location.href = destination;
      } catch (err) {
        errEl.textContent = err.message || 'Terjadi kesalahan saat login';
        errEl.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
