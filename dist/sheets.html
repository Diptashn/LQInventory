<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sheets Sync — LilQuin Kitchen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" crossorigin src="/assets/app-CPrg_ZFv.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/app-DfGWpdBI.css">
</head>
<body class="bg-stone-100 text-stone-800 min-h-screen">

  <header class="bg-white border-b border-stone-200 sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 font-semibold text-stone-900">
        <img src="/assets/logo-C47JIAAB.jpg" alt="LilQuin Kitchen" class="h-8 w-8 rounded">
        <span>LilQuin Kitchen</span>
      </a>
      <nav class="flex gap-1 text-sm">
        <a href="inventory.html" class="px-3 py-1.5 rounded hover:bg-stone-100">📋 Inventory</a>
        <a href="estimate.html" class="px-3 py-1.5 rounded hover:bg-stone-100">💰 Estimate</a>
        <a href="sheets.html" class="px-3 py-1.5 rounded bg-stone-100 font-medium">📊 Sheets Sync</a>
      </nav>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8">

    <section class="bg-white rounded-2xl shadow-sm border border-stone-200 p-6">
      <h2 class="text-xl font-semibold text-stone-900 mb-4">Sheets Sync Status</h2>

      <div class="grid gap-4 mb-4">
        <div class="p-4 bg-stone-50 rounded-lg border border-stone-200">
          <p class="text-sm text-stone-500">Token status</p>
          <p id="token-status" class="text-xs mt-1 font-medium">—</p>
        </div>
        <div class="p-4 bg-stone-50 rounded-lg border border-stone-200">
          <p class="text-sm text-stone-500">Sheet ID</p>
          <p id="sheet-id" class="text-xs mt-1 font-mono">1wA5WN0evR5VpMujKphfY7441T80bEz6OjH0EOnOW1JA</p>
        </div>
      </div>

      <div class="grid gap-2">
        <button id="sync-s2db" class="px-4 py-2.5 bg-[#b4602e] text-white font-medium rounded-lg hover:bg-[#8a4520] transition">
          Sheet → DB (pull prices)
        </button>
        <button id="sync-db2s" class="px-4 py-2.5 bg-[#b4602e] text-white font-medium rounded-lg hover:bg-[#8a4520] transition">
          DB → Sheet (push prices)
        </button>
      </div>

      <p id="sync-status" class="mt-2 text-sm text-stone-500">—</p>
    </section>

  </main>

  <footer class="text-center text-xs text-stone-400 py-6">
    LilQuin Kitchen — inventory & estimation
  </footer>

</body>
</html>
