<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Login – LQInventory</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/favicon.ico">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { --brand:#d946ef; --brand-dark:#c026d3; --bg:#fdf4ff; }
  body { background:var(--bg); }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<main class="w-full max-w-md">
  <div class="bg-white rounded-2xl shadow-sm p-8 ring-1 ring-purple-100">
    <h1 class="text-2xl font-semibold text-center text-gray-900 mb-6">LQInventory</h1>

    <form id="loginForm" class="space-y-4" novalidate>
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input type="text" id="username" name="username" required autocomplete="username"
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent" />
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password"
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent" />
      </div>
      <p id="err" class="text-red-600 text-sm min-h-[1.25rem] hidden"></p>
      <button type="submit"
              class="w-full py-2 bg-purple-600 text-white font-medium rounded-lg hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2 transition">
        Sign in
      </button>
    </form>
  </div>
  <p class="text-center text-xs text-gray-500 mt-4">Admin creates accounts via /api/register (requires auth)</p>
</main>
<script type="module">
const API_BASE = 'https://lq-inventory.vercel.app/api';
const form = document.getElementById('loginForm');
const errEl = document.getElementById('err');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errEl.classList.add('hidden');
  const fd = new FormData(form);
  const body = { username: fd.get('username'), password: fd.get('password') };
  try {
    const res = await fetch(`${API_BASE}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include', // send/receive cookies
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');
    // token returned in body (and cookie); store for Bearer use
    localStorage.setItem('auth_token', data.token);
    window.location.href = 'index.html';
  } catch (e) {
    errEl.textContent = e.message;
    errEl.classList.remove('hidden');
  }
});
</script>
</body>
</html>
