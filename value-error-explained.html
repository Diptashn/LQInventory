<head>

<style>
  body { margin: 0; background: #020617; color: #cbd5e1; font-family: 'Courier New', monospace; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 18px; text-align: center; letter-spacing: 2px; margin: 0 0 6px; color: #fbbf24; }

<body>
<div class="wrap">
  <h1>#VALUE! — EXPLAINED</h1>
  <p class="sub">Google Sheets · CAKE 18 CM · JANUARI 2026 block</p>

  <!-- ── 1. THE BROKEN STATE ─────────────────────────────────────────── -->
  <div class="card">
    <h2>1 · WHAT YOU SEE (BROKEN)</h2>
    <svg viewBox="0 0 720 150" width="100%" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
        </pattern>
        <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
          <path d="M0,0 L8,3 L0,6 Z" fill="#fb7185"/>
        </marker>
      </defs>
      <rect width="720" height="150" fill="url(#grid)"/>
      <!-- Table frame -->
      <rect x="40" y="20" width="640" height="70" rx="4" fill="none" stroke="#334155" stroke-width="1.5"/>
      <!-- Column headers -->
      <text x="80" y="45" font-size="9" fill="#fbbf24" text-anchor="middle">NO.</text>
      <text x="200" y="45" font-size="9" fill="#fbbf24" text-anchor="middle">NAMA BAHAN</text>
      <text x="360" y="45" font-size="9" fill="#fbbf24" text-anchor="middle">HARGA/KG</text>
      <text x="500" y="45" font-size="9" fill="#fbbf24" text-anchor="middle">HARGA/GRAM</text>
      <text x="640" y="45" font-size="9" fill="#fbbf24" text-anchor="middle">HARGA TOTAL</text>
      <!-- Row 1 – broken -->
      <text x="80" y="75" font-size="11" fill="#cbd5e1" text-anchor="middle">1</text>
      <text x="200" y="75" font-size="11" fill="#cbd5e1" text-anchor="middle">Tepung Terigu</text>
      <!-- HARGA/KG cell with TEXT -->
      <rect x="290" y="60" width="140" height="28" rx="3" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
      <text x="360" y="78" font-size="11" fill="#fb7185" text-anchor="middle">"Rp 15.000"</text>
      <!-- HARGA/GRAM formula cell -->
      <rect x="430" y="60" width="140" height="28" rx="3" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1"/>
      <text x="500" y="78" font-size="11" fill="#fb7185" text-anchor="middle">=1000/C3</text>
      <!-- #VALUE! error -->
      <rect x="570" y="60" width="140" height="28" rx="3" fill="rgba(136,19,55,0.5)" stroke="#fb7185" stroke-width="2"/>
      <text x="640" y="78" font-size="12" fill="#fb7185" text-anchor="middle" font-weight="bold">#VALUE!</text>
      <!-- Arrows -->
      <line x1="300" y1="98" x2="500" y2="98" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
      <text x="400" y="115" font-size="9" fill="#fb7185" text-anchor="middle">text in C → formula can't divide</text>
    </svg>
  </div>

  <!-- ── 2. WHY IT HAPPENS ──────────────────────────────────────────── -->
  <div class="card">
    <h2>2 · WHY THE FORMULA FAILS</h2>
    <svg viewBox="0 0 720 130" width="100%" xmlns="http://www.w3.org/2000/svg">
      <rect width="720" height="130" fill="url(#grid)"/>
      <!-- Formula box -->
      <rect x="60" y="25" width="280" height="40" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
      <text x="200" y="48" font-size="11" fill="#34d399" text-anchor="middle">Formula in HARGA/GRAM</text>
      <text x="200" y="62" font-size="11" fill="#cbd5e1" text-anchor="middle" font-family="monospace">=1000 / C3</text>
      <!-- Equals -->
      <text x="365" y="55" font-size="20" fill="#94a3b8" text-anchor="middle">=</text>
      <!-- Input box (text) -->
      <rect x="400" y="25" width="260" height="40" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
      <text x="530" y="48" font-size="10" fill="#fb7185" text-anchor="middle">Cell C3 contains:</text>
      <text x="530" y="62" font-size="11" fill="#fb7185" text-anchor="middle" font-family="monospace">"Rp 15.000"  ← TEXT, not a number</text>
      <!-- Result -->
      <text x="360" y="100" font-size="11" fill="#fb7185" text-anchor="middle" text-decoration="line-through">1000 ÷ "Rp 15.000"</text>
      <text x="360" y="120" font-size="12" fill="#fbbf24" text-anchor="middle">Sheets can't divide by text  →  #VALUE!</text>
    </svg>
  </div>

  <!-- ── 3. THE FIX ─────────────────────────────────────────────────── -->
  <div class="card">
    <h2>3 · THE FIX — PUT A NUMBER IN C</h2>
    <svg viewBox="0 0 720 150" width="100%" xmlns="http://www.w3.org/2000/svg">
      <rect width="720" height="150" fill="url(#grid)"/>
      <!-- Table frame -->
      <rect x="40" y="20" width="640" height="70" rx="4" fill="none" stroke="#334155" stroke-width="1.5"/>
      <!-- Column headers -->
      <text x="80" y="45" font-size="9" fill="#fbbf24" text-anchor="middle">NO.</text>
      <text x="200" y="45" font-size="9" fill="#fbbf24" text-anchor="middle">NAMA BAHAN</text>
      <text x="360" y="45" font-size="9" fill="#fbbf24" text-anchor="middle">HARGA/KG</text>
      <text x="500" y="45" font-size="9" fill="#fbbf24" text-anchor="middle">HARGA/GRAM</text>
      <text x="640" y="45" font-size="9" fill="#fbbf24" text-anchor="middle">HARGA TOTAL</text>
      <!-- Row 1 – fixed -->
      <text x="80" y="75" font-size="11" fill="#cbd5e1" text-anchor="middle">1</text>
      <text x="200" y="75" font-size="11" fill="#cbd5e1" text-anchor="middle">Tepung Terigu</text>
      <!-- HARGA/KG cell with NUMBER -->
      <rect x="290" y="60" width="140" height="28" rx="3" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
      <text x="360" y="78" font-size="11" fill="#34d399" text-anchor="middle" font-family="monospace">15000</text>
      <!-- HARGA/GRAM formula cell -->
      <rect x="430" y="60" width="140" height="28" rx="3" fill="rgba(6,78,59,0.3)" stroke="#34d399" stroke-width="1"/>
      <text x="500" y="78" font-size="11" fill="#34d399" text-anchor="middle" font-family="monospace">=1000/C3</text>
      <!-- Fixed result -->
      <rect x="570" y="60" width="140" height="28" rx="3" fill="rgba(6,78,59,0.5)" stroke="#34d399" stroke-width="2"/>
      <text x="640" y="78" font-size="12" fill="#34d399" text-anchor="middle" font-weight="bold">15</text>
      <!-- Arrows -->
      <line x1="300" y1="98" x2="500" y2="98" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
      <text x="400" y="115" font-size="9" fill="#34d399" text-anchor="middle">number in C → 1000 ÷ 15000 = 15 (Rp/gr)</text>
    </svg>
  </div>

  <!-- ── 4. OPTIONAL GUARD ──────────────────────────────────────────── -->
  <div class="card">
    <h2>4 · OPTIONAL: GUARD THE FORMULA</h2>
    <svg viewBox="0 0 720 100" width="100%" xmlns="http://www.w3.org/2000/svg">
      <rect width="720" height="100" fill="url(#grid)"/>
      <rect x="60" y="20" width="600" height="55" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="360" y="42" font-size="10" fill="#94a3b8" text-anchor="middle">If you want the formula to survive future text in C:</text>
      <text x="360" y="65" font-size="12" fill="#fbbf24" text-anchor="middle" font-family="monospace">=IF(ISNUMBER(C3), 1000/C3, "")</text>
      <text x="360" y="85" font-size="9" fill="#94a3b8" text-anchor="middle">Returns a blank instead of #VALUE! when C3 is not a number</text>
    </svg>
  </div>

  <p class="sub" style="margin-top:12px;">Sheet: 1wA5WN0evR5VpMujKphfY7441T80bEz6OjH0EOnOW1JA</p>
</div>
