<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LilQuin Kitchen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-stone-100 text-stone-800 min-h-screen">

  <!-- Top bar -->
  <header class="bg-white border-b border-stone-200 sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 font-semibold text-stone-900">
        <img src="assets/images/logo.jpg" alt="LilQuin Kitchen" class="h-8 w-8 rounded">
        <span>LilQuin Kitchen</span>
      </a>
      <nav class="flex gap-1 text-sm items-center">
        <a href="inventory.html" class="px-3 py-1.5 rounded hover:bg-stone-100">📋 Inventory</a>
        <a href="estimate.html" class="px-3 py-1.5 rounded hover:bg-stone-100">💰 Estimate</a>
        <a href="sheets.html" class="px-3 py-1.5 rounded hover:bg-stone-100">📊 Sheets Sync</a>
        <button id="logoutBtn" class="px-3 py-1.5 rounded hover:bg-red-50 text-red-600 text-sm font-medium">Logout</button>
      </nav>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8">

    <!-- Hero -->
    <section class="bg-white rounded-2xl shadow-sm border border-stone-200 p-8 text-center">
      <h1 class="text-3xl font-bold text-stone-900">Welcome to LilQuin Kitchen</h1>
      <p class="mt-2 text-stone-500">Select a section to get started</p>

      <div class="mt-6 flex flex-wrap justify-center gap-3">
        <a href="inventory.html" class="px-5 py-2.5 rounded-lg bg-[#b4602e] text-white font-medium hover:bg-[#8a4520] transition">📋 Inventory</a>
        <a href="estimate.html" class="px-5 py-2.5 rounded-lg bg-[#b4602e] text-white font-medium hover:bg-[#8a4520] transition">💰 Estimate</a>
        <a href="sheets.html" class="px-5 py-2.5 rounded-lg bg-[#b4602e] text-white font-medium hover:bg-[#8a4520] transition">📊 Sheets Sync</a>
      </div>
    </section>

  </main>

  <footer class="text-center text-xs text-stone-400 py-6">
    LilQuin Kitchen — inventory &amp; estimation
  </footer>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
